<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Website drafts</title>
  <style>
    :root { color-scheme: light; --ink: #181714; --paper: #f2eee6; --line: #d7d0c4; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(620px, 100%); padding: clamp(28px, 6vw, 64px); border: 1px solid var(--line); background: rgba(255,255,255,.48); }
    .mark { width: 42px; height: 42px; margin-bottom: 48px; border: 8px solid var(--ink); border-top-color: transparent; border-radius: 50%; transform: rotate(-25deg); }
    p { margin: 0; color: #6d675f; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { max-width: 11ch; margin: 12px 0 28px; font-size: clamp(44px, 10vw, 88px); font-weight: 780; letter-spacing: -.065em; line-height: .88; }
    a { color: var(--ink); font-weight: 700; text-underline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <p>Occhino · Website drafts</p>
    <h1>Private review link required.</h1>
    <a href="mailto:webmaster@occhino.it">webmaster@occhino.it</a>
  </main>
</body>
</html>
